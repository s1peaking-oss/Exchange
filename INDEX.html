<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 환율</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #f4f5f7;
    }
    body {
      font-family: -apple-system, "Samsung Sans", "Roboto", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .card {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1 / 1;          /* 2x2 정사각형에 맞춤 */
      background: #ffffff;
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      border: 1px solid #f0f0f2;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .title { font-size: 15px; font-weight: 700; color: #1a1a1a; }
    .refresh {
      width: 30px; height: 30px; border: none; border-radius: 9px;
      background: #f5f6f8; color: #555;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .refresh.spin svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

    .rates { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
    .row + .row { border-top: 1px solid #f4f4f6; }
    .left { display: flex; align-items: center; gap: 9px; }
    .flag { font-size: 24px; line-height: 1; }
    .code { font-size: 14px; font-weight: 700; color: #222; }
    .name { font-size: 10px; color: #a3a3ab; margin-top: 1px; }
    .right { text-align: right; }
    .value {
      font-size: 22px; font-weight: 800; color: #1a1a1a;
      letter-spacing: -0.5px; font-variant-numeric: tabular-nums; line-height: 1.1;
    }
    .avg { font-size: 10.5px; color: #6b8cff; font-weight: 600; margin-top: 2px; }

    .footer { text-align: center; margin-top: 6px; }
    #status { font-size: 10px; color: #bcbcc4; }
    #status.error { color: #e05a4f; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">오늘의 환율</div>
      <button id="refresh" class="refresh" aria-label="새로고침">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>

    <div class="rates">
      <div class="row">
        <div class="left">
          <span class="flag">🇺🇸</span>
          <div><div class="code">USD</div><div class="name">미국 달러</div></div>
        </div>
        <div class="right">
          <div class="value" id="usd-val">—</div>
          <div class="avg" id="usd-avg">평균 —</div>
        </div>
      </div>
      <div class="row">
        <div class="left">
          <span class="flag">🇨🇳</span>
          <div><div class="code">CNY</div><div class="name">중국 위안</div></div>
        </div>
        <div class="right">
          <div class="value" id="cny-val">—</div>
          <div class="avg" id="cny-avg">평균 —</div>
        </div>
      </div>
    </div>

    <div class="footer"><span id="status">불러오는 중…</span></div>
  </div>

  <script>
    const usdEl = document.getElementById('usd-val');
    const cnyEl = document.getElementById('cny-val');
    const usdAvgEl = document.getElementById('usd-avg');
    const cnyAvgEl = document.getElementById('cny-avg');
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refresh');

    function fmt(n) {
      return Number(n).toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }
    function ymd(d) { return d.toISOString().slice(0, 10); }

    async function fetchSeries(from) {
      const end = new Date();
      const start = new Date();
      start.setDate(end.getDate() - 9);
      const url = `https://api.frankfurter.dev/v1/${ymd(start)}..${ymd(end)}?base=${from}&symbols=KRW`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('네트워크 오류');
      const data = await res.json();
      const dates = Object.keys(data.rates || {}).sort();
      if (dates.length === 0) throw new Error('데이터 없음');
      const recent = dates.slice(-7);
      const vals = recent.map(d => data.rates[d].KRW);
      const current = data.rates[dates[dates.length - 1]].KRW;
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      return { current, avg, lastDate: dates[dates.length - 1] };
    }

    async function load() {
      statusEl.classList.remove('error');
      statusEl.textContent = '불러오는 중…';
      refreshBtn.classList.add('spin');
      try {
        const [usd, cny] = await Promise.all([fetchSeries('USD'), fetchSeries('CNY')]);
        usdEl.textContent = fmt(usd.current);
        cnyEl.textContent = fmt(cny.current);
        usdAvgEl.textContent = '평균 ' + fmt(usd.avg);
        cnyAvgEl.textContent = '평균 ' + fmt(cny.avg);
        const [y, m, d] = usd.lastDate.split('-');
        statusEl.textContent = `${Number(m)}/${Number(d)} 기준 · 단위 원(KRW)`;
      } catch (e) {
        statusEl.textContent = '불러오기 실패 · 새로고침 눌러주세요';
        statusEl.classList.add('error');
      } finally {
        setTimeout(() => refreshBtn.classList.remove('spin'), 600);
      }
    }

    refreshBtn.addEventListener('click', load);
    load();
  </script>
</body>
</html>
